name: Inspect published OmniRoute OpenCode bundle

on:
  push:
    branches:
      - hotfix/opencode-free-20260918

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current mirrored upstream channel
        run: docker pull ghcr.io/diegosouzapw/omniroute:next

      - name: Locate compiled OpenCode runtime code
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint node ghcr.io/diegosouzapw/omniroute:next --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const needles = [
            "OPENCODE_SYNTHESIZE_CLI_HEADERS",
            "x-opencode-session",
            "muse-spark",
            "FreeUsageLimitError",
            "opencode.ai/zen/v1",
          ];

          const roots = ["/app/.next", "/app/dev", "/app/server.js"];
          const seen = new Set();

          function visit(p) {
            if (!fs.existsSync(p)) return;
            const stat = fs.statSync(p);
            if (stat.isDirectory()) {
              for (const name of fs.readdirSync(p)) {
                if (name === "node_modules" || name === "data") continue;
                visit(path.join(p, name));
              }
              return;
            }
            if (!/\.(?:js|mjs|cjs)$/.test(p) || stat.size > 12_000_000) return;
            let body;
            try { body = fs.readFileSync(p, "utf8"); } catch { return; }
            const hits = needles.filter((n) => body.includes(n));
            if (!hits.length || seen.has(p)) return;
            seen.add(p);
            console.log("\nFILE", p, "SIZE", stat.size, "HITS", hits.join(","));
            for (const needle of hits) {
              const i = body.indexOf(needle);
              const start = Math.max(0, i - 500);
              const end = Math.min(body.length, i + needle.length + 1200);
              console.log("NEEDLE", needle);
              console.log(body.slice(start, end).replace(/[\r\n]+/g, " "));
            }
          }

          for (const root of roots) visit(root);
          console.log("\nMATCHED_FILES", seen.size);
          if (!seen.size) process.exitCode = 2;
          NODE
