name: Inspect published OmniRoute OpenCode bundle

on:
  push:
    branches:
      - hotfix/opencode-free-20260918

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current mirrored upstream channel
        run: docker pull ghcr.io/diegosouzapw/omniroute:next

      - name: Inspect exact OpenCode source and compiled chunk
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint node ghcr.io/diegosouzapw/omniroute:next --input-type=module - <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const files = [
            "/app/open-sse/executors/opencode.ts",
            "/app/.build/next/server/chunks/45782.js",
          ];
          const needles = [
            "OPENCODE_SYNTHESIZE_CLI_HEADERS",
            "x-opencode-session",
            "opencode.ai/zen/v1",
            "muse-spark",
            "forwardOpencodeClientHeaders",
            "transformRequest(",
          ];

          for (const file of files) {
            const body = fs.readFileSync(file, "utf8");
            console.log("\n=== FILE ===", file);
            console.log("SHA256", crypto.createHash("sha256").update(body).digest("hex"));
            console.log("SIZE", body.length);
            for (const needle of needles) {
              let from = 0;
              let count = 0;
              while (count < 3) {
                const i = body.indexOf(needle, from);
                if (i < 0) break;
                count++;
                const start = Math.max(0, i - 1400);
                const end = Math.min(body.length, i + needle.length + 4200);
                console.log("\n--- NEEDLE", JSON.stringify(needle), "MATCH", count, "AT", i, "---");
                console.log(body.slice(start, end).replace(/[\r\n]+/g, " "));
                from = i + needle.length;
              }
            }
          }
          NODE
