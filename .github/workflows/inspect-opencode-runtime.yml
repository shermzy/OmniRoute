name: Inspect published OmniRoute OpenCode bundle

on:
  push:
    branches:
      - hotfix/opencode-free-20260918

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current OpenCode free-tier contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, tempfile, os

          models = [
            "mimo-v2.5-free",
            "big-pickle",
            "deepseek-v4-flash-free",
            "hy3-free",
            "nemotron-3-ultra-free",
            "north-mini-code-free",
          ]
          tools = ["_noop", "read", "bash", "grep", "glob", "write", "edit"]
          url = "https://opencode.ai/zen/v1/chat/completions"
          headers = [
            "Content-Type: application/json",
            "Accept: text/event-stream",
            "User-Agent: opencode/1.18.31",
            "x-opencode-client: desktop",
            "x-opencode-project: global",
            "x-opencode-session: ses_abcdef123456abcdefghijklmn",
            "x-opencode-request: msg_abcdef123456abcdefghijklmn",
          ]

          for model in models:
            print(f"=== MODEL {model} ===")
            success = False
            for tool in tools:
              payload = {
                "model": model,
                "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                "stream": True,
                "tools": [{
                  "type": "function",
                  "function": {
                    "name": tool,
                    "description": "Compatibility placeholder. Do not call.",
                    "parameters": {"type": "object", "properties": {}},
                  },
                }],
              }
              fd, path = tempfile.mkstemp()
              os.close(fd)
              cmd = ["curl","-sS","--max-time","35","-o",path,"-w","%{http_code}",url]
              for h in headers:
                cmd += ["-H", h]
              cmd += ["--data-binary", json.dumps(payload)]
              try:
                p = subprocess.run(cmd, text=True, capture_output=True, timeout=40)
                status = p.stdout.strip()[-3:] if p.stdout.strip() else "000"
                body = open(path, "r", encoding="utf-8", errors="replace").read(900)
              except Exception as e:
                status = "ERR"
                body = str(e)
              finally:
                try: os.unlink(path)
                except OSError: pass
              summary = " ".join(body.split())[:500]
              print(f"tool={tool} status={status} body={summary}")
              if status == "200":
                success = True
                break
            print(f"RESULT model={model} success={str(success).lower()}")
          PY
