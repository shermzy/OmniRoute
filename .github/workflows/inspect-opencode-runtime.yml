name: Inspect published OmniRoute OpenCode bundle

on:
  push:
    branches:
      - hotfix/opencode-free-20260918

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current mirrored upstream channel
        run: docker pull ghcr.io/diegosouzapw/omniroute:next

      - name: Inspect standalone layout and OpenCode strings
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ghcr.io/diegosouzapw/omniroute:next -lc '
            echo "=== TOP ==="
            find /app -maxdepth 3 -type f | sort | head -n 300
            echo "=== OPENCODE_FILENAMES ==="
            find /app -type f -iname "*opencode*" | sort | head -n 200
            echo "=== SESSION_STRING_MATCHES ==="
            grep -R -l --binary-files=without-match "x-opencode-session" /app 2>/dev/null | head -n 100 || true
            echo "=== SYNTHESIS_STRING_MATCHES ==="
            grep -R -l --binary-files=without-match "OPENCODE_SYNTHESIZE_CLI_HEADERS" /app 2>/dev/null | head -n 100 || true
            echo "=== ZEN_URL_MATCHES ==="
            grep -R -l --binary-files=without-match "opencode.ai/zen/v1" /app 2>/dev/null | head -n 100 || true
          '
